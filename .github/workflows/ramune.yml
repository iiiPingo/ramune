name: Ramune

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = check for episodes · test = send a test message · summary = send today's schedule now"
        type: choice
        options: [normal, test, summary]
        default: test

permissions:
  contents: write   # needed to commit state/state.json back to the repo

concurrency:
  group: ramune
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check for new episodes
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAL_USERNAME: ${{ vars.MAL_USERNAME }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          EPISODE_ALERTS: ${{ vars.EPISODE_ALERTS }}
          DAILY_SUMMARY: ${{ vars.DAILY_SUMMARY }}
          SCHEDULE_CHANGES: ${{ vars.SCHEDULE_CHANGES }}
          UP_NEXT: ${{ vars.UP_NEXT }}
          SUMMARY_HOUR: ${{ vars.SUMMARY_HOUR }}
          ANNOUNCE_DELAY_MINUTES: ${{ vars.ANNOUNCE_DELAY_MINUTES }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS }}
          FAIL_ALERT: ${{ vars.FAIL_ALERT }}
          FAIL_ALERT_FROM: ${{ vars.FAIL_ALERT_FROM }}
          FAIL_ALERT_TO: ${{ vars.FAIL_ALERT_TO }}
          SUMMARY_LINKS: ${{ vars.SUMMARY_LINKS }}
          ANIKOTO_URL: ${{ vars.ANIKOTO_URL }}
          ANIKOTO_DIRECT: ${{ vars.ANIKOTO_DIRECT }}
          PTW_ALERTS: ${{ vars.PTW_ALERTS }}
          MODE: ${{ inputs.mode || 'normal' }}
        run: python3 ramune.py

      - name: Save state
        if: always()
        run: |
          [ -d state ] || exit 0
          git add state
          if git diff --cached --quiet; then
            echo "State unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "ramune-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ramune: update state"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            echo "Push failed (attempt $attempt), retrying..."
            sleep 5
          done
          exit 1
